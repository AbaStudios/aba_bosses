plugins {
    id 'dev.architectury.loom' version '1.17.487' apply false
    id 'architectury-plugin' version '3.5.169'
    id 'com.gradleup.shadow' version '8.3.6' apply false
}

architectury {
    minecraft = project.minecraft_version
}

def usingHotswapAgent = providers.gradleProperty('aba.hotswap').map { it.toBoolean() }.getOrElse(false)
def hotswapAgentPath = new File(System.getProperty('java.home'), 'lib/hotswap/hotswap-agent.jar')

if (usingHotswapAgent && !hotswapAgentPath.isFile()) {
    throw new GradleException("HotswapAgent is enabled, but its JAR was not found at ${hotswapAgentPath}")
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        maven {
            name = 'FzzyMaven'
            url = 'https://maven.fzzyhmstrs.me/'
        }
        maven {
            name = 'Kotlin for Forge'
            url = 'https://thedarkcolour.github.io/KotlinForForge/'
        }
        maven {
            name = 'BlameJared'
            url = 'https://maven.blamejared.com/'
        }
        maven {
            name = 'Curios'
            url = 'https://maven.theillusivec4.top/'
        }
        maven {
            name = 'DevOS Releases'
            url = 'https://mvn.devos.one/releases/'
        }
        maven {
            name = 'DevOS Snapshots'
            url = 'https://mvn.devos.one/snapshots/'
        }
        maven {
            name = 'JitPack'
            url = 'https://jitpack.io/'
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Modrinth'
                    url = 'https://api.modrinth.com/maven'
                }
            }
            filter {
                includeGroup 'maven.modrinth'
            }
        }
    }

    loom {
        silentMojangMappingsLicense()

        runs {
            client {
                if (usingHotswapAgent) {
                    vmArg '-XX:+AllowEnhancedClassRedefinition'
                    vmArg '-XX:+ClassUnloading'
                    vmArg '-XX:HotswapAgent=fatjar'
                    vmArg '-Dhotswapagent.disablePlugin=Log4j2,JacksonPlugin,Proxy'
                    vmArg '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5005'
                }
            }
        }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}
